name: ahlachat
description: A new Flutter project.

publish_to: 'none'

version: 1.0.111+111

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8

  dio: ^5.8.0+1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5


  auto_size_text: ^3.0.0
  readmore: ^3.0.0
  badges: ^3.1.2
  animated_overflow: ^2.0.0
  cherry_toast: ^1.12.0
  fluttertoast: ^8.2.12
  animate_do: ^4.2.0
  animated_text_kit: ^4.2.3
  delayed_display: ^2.0.0
  avatar_glow: ^3.0.1
  motion_toast: ^2.11.0
  flutter_smart_dialog: ^4.9.8+8
  marquee: ^2.3.0
  percent_indicator: ^4.2.5
  circular_countdown: ^2.1.0
  simple_timer: ^2.0.0
  spring: ^2.0.2
  filling_slider: ^0.0.2
  flutter_circle_color_picker: ^0.3.0
  tab_indicator_styler: ^2.0.0
  flutter_custom_clippers: ^2.1.0
  # HTTP — لازم يظل 0.13.x بسبب svgaplayer_flutter



  # Images
  image_picker: ^1.1.2
  image_cropper:
    path: third_party/image_cropper
  photo_view: ^0.15.0
  # flutter_svg is not used in the app.
  flutter_image_slideshow: ^0.1.6
  banner_carousel: ^1.2.1
  carousel_slider: ^5.0.0
  zoom_pinch_overlay: ^1.4.0

  # Video / Audio

  wakelock_plus: ^1.4.2
  # Agora
  agora_rtc_engine: ^6.6.4

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.2.10
  firebase_app_check: ^0.3.2+10


  # flutter_facebook_auth is not used in the app.


  # Notifications
  flutter_local_notifications: ^17.2.4
  in_app_update: ^4.2.3
  google_sign_in: ^6.2.2
  flutter_keyboard_visibility: ^6.0.0
  flutter_mentions: ^2.0.1
  timer_count_down: ^2.2.2
  sentry_flutter: ^8.14.2
  # new_version_plus is not used in the app.




  # WebView
  webview_flutter: ^4.10.0


  # Pusher
  pusher_channels: any
  pusher_client:
    path: third_party/pusher_client

  # Payments
  purchases_flutter: ^8.10.0

  # Country
  country_picker: ^2.0.27
  country_code_picker: ^3.4.1
  country_list_pick: ^1.0.1+6
  country_calling_code_picker: ^2.0.1

  # Refresh / Interaction
  pull_to_refresh: ^2.0.0
  declarative_refresh_indicator: ^0.1.0
  draggable_widget: ^2.0.0
  popover: ^0.3.1
  slider_controller: ^0.0.4

  # Animation
  lottie: ^2.7.0

  # Icons
  font_awesome_flutter: ^11.0.0

  # SVGA


  # Games
  flutter_fortune_wheel: ^1.3.0
  roulette: ^0.3.0

  # URL
  url_launcher: ^6.3.1
  # Video / Audio
  video_player: ^2.9.5
  just_audio: ^0.9.46
  audio_video_progress_bar: ^2.0.3
  rxdart: ^0.27.7
  flutter_sound: ^9.28.0
  on_audio_query: ^2.9.0
  # Device / Network
  device_info_plus: ^10.1.2
  package_info_plus: ^9.0.0
  connectivity_plus: ^6.1.5

  permission_handler: ^11.4.0
  flutter_jailbreak_detection: ^1.10.0
  # Other
  pin_code_fields: ^8.0.1
  timeago: ^3.7.1
  wp_pivot_flutter: ^1.0.0
  http: ^0.13.6
  google_fonts: ^4.0.4
  cached_network_image: ^3.2.3
  svgaplayer_flutter: ^2.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  image: assets/image/worldLogo.png
  color: "#c7ebff"
  android12: true
  android_12:
    image: assets/image/worldLogo.png

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/language/
    - assets/audios/

  fonts:
    - family: cairo
      fonts:
        - asset: assets/font/Cairo-VariableFont_wght.ttf
          weight: 400

    - family: NotoSans
      fonts:
        - asset: assets/font/Noto-Sans-700.ttf
          weight: 400

    - family: numbers
      fonts:
        - asset: assets/font/DancingScript-Medium.ttf
          weight: 400

    - family: anton
      fonts:
        - asset: assets/font/DancingScript-Medium.ttf
          weight: 400

    - family: Metal
      fonts:
        - asset: assets/font/MetalMania-Regular.ttf
          weight: 400

    - family: Omar
      fonts:
        - asset: assets/font/Omar-Bold-1.ttf
          weight: 400

    - family: OmarR
      fonts:
        - asset: assets/font/DIN-CondensedBold.ttf
          weight: 400

    - family: Arslan
      fonts:
        - asset: assets/font/Arslan.ttf
          weight: 400

    - family: Emoji
      fonts:
        - asset: assets/font/NotoColorEmoji-Regular.ttf
          weight: 400
