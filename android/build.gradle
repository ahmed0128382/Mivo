
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Older Flutter plugins can omit the namespace required by newer Android Gradle plugins.
subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        def androidExtension = subproject.extensions.findByName('android')

        if (androidExtension != null) {
            if (!androidExtension.namespace) {
                def manifest = subproject.file('src/main/AndroidManifest.xml')

                if (manifest.exists()) {
                    def matcher = manifest.getText('UTF-8') =~ /package=["']([^"']+)["']/

                    if (matcher.find()) {
                        androidExtension.namespace = matcher.group(1)
                    }
                }
            }
        }
    }

    // Keep Kotlin JVM target consistent with the Android Java target.
    subproject.plugins.withId('org.jetbrains.kotlin.android') {
        subproject.tasks.withType(
            org.jetbrains.kotlin.gradle.tasks.KotlinCompile
        ).configureEach {
            def androidExtension = subproject.extensions.findByName('android')

            if (androidExtension != null) {
                def javaTarget = androidExtension.compileOptions.targetCompatibility
                kotlinOptions.jvmTarget = javaTarget.toString()
            }
        }
    }

    subproject.afterEvaluate {
        if (subproject.hasProperty('android')) {
            def compileSdk = subproject.android.compileSdkVersion
            def sdkString = compileSdk?.toString() ?: ""

            if (sdkString.startsWith("android-")) {
                sdkString = sdkString.replace("android-", "")
            }

            def sdkInt = sdkString.isInteger() ? sdkString.toInteger() : 0

            if (sdkInt > 0 && sdkInt < 31) {
                subproject.android.compileSdkVersion = 34
            }
        }
    }

    if (subproject.name == 'sentry_flutter') {
        subproject.tasks.withType(
            org.jetbrains.kotlin.gradle.tasks.KotlinCompile
        ).configureEach {
            kotlinOptions.languageVersion = '1.8'
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
